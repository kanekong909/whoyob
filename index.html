<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>WorkNotes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="assets/icons/logo.svg" type="image/x-icon">
</head>
<body>

<!-- ── AUTH ─────────────────────────────────────────────────────── -->
<div id="view-auth" class="view">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">📋</div>
      <h1>WorkNotes</h1>
      <p>Tu guía de trabajo siempre a mano</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login"    onclick="showAuthTab('login')">Entrar</button>
      <button class="auth-tab"        data-tab="register" onclick="showAuthTab('register')">Registro</button>
    </div>

    <form id="login-form" class="auth-form" onsubmit="submitLogin(event)">
      <div class="field">
        <label>Email</label>
        <input id="login-email" type="email" placeholder="tu@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <div class="password-field">
          <input id="login-pass" type="password" placeholder="••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle" onclick="togglePassword('login-pass', this)" tabindex="-1">👁</button>
        </div>
      </div>
      <button id="login-btn" class="btn-primary" type="submit">Entrar</button>
    </form>

    <form id="register-form" class="auth-form" style="display:none" onsubmit="submitRegister(event)">
      <div class="field">
        <label>Nombre</label>
        <input id="reg-name" type="text" placeholder="Tu nombre" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="tu@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <div class="password-field">
          <input id="reg-pass" type="password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('reg-pass', this)" tabindex="-1">👁</button>
        </div>
      </div>
      <button id="reg-btn" class="btn-primary" type="submit">Crear cuenta</button>
    </form>
  </div>
</div>

<!-- ── WORKSPACES VACÍO ──────────────────────────────────────────── -->
<div id="view-workspaces" class="view">
  <div class="ws-empty">
    <div class="ws-empty-icon">📋</div>
    <h2>Tu primer espacio</h2>
    <p>Crea un espacio de trabajo para empezar a guardar información de tu trabajo.</p>
    <button class="btn-primary" onclick="workspaces.showCreate()">Crear espacio de trabajo</button>
  </div>
</div>

<!-- ── MAIN ──────────────────────────────────────────────────────── -->
<div id="view-main" class="view">

  <!-- Topbar -->
  <div class="topbar">
    <button class="topbar-menu" onclick="app.openSidebar()">☰</button>
    <div class="topbar-info">
      <div class="topbar-ws">
        <span class="topbar-ws-icon" id="ws-icon-display">📁</span>
        <span class="topbar-ws-name" id="ws-title">Cargando...</span>
      </div>
    </div>
    <span id="user-name" style="font-size:13px;color:var(--muted);flex-shrink:0;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  </div>

  <!-- Búsqueda -->
  <div class="search-bar">
    <input class="search-input" type="search" placeholder="Buscar tarjetas..."
           oninput="cards.onSearch(this.value)">
  </div>

  <!-- Categorías -->
  <div class="category-bar" id="category-tabs"></div>

  <!-- Tarjetas -->
  <div class="cards-scroll">
    <div id="cards-grid"></div>
  </div>

  <!-- FAB nueva tarjeta -->
  <button class="fab" onclick="cards.showForm()" title="Nueva tarjeta">＋</button>
</div>

<!-- ── SIDEBAR ───────────────────────────────────────────────────── -->
<div id="sidebar-overlay" onclick="app.closeSidebar()"></div>
<nav id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">📋</div>
      <span class="sidebar-logo">WorkNotes</span>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebar-avatar">?</div>
      <span class="sidebar-user-name" id="sidebar-user-name"></span>
    </div>
  </div>
  <div class="sidebar-body">
    <div class="sidebar-section-title">Espacios de trabajo</div>
    <div id="workspace-list"></div>
  </div>
  <div class="sidebar-footer">
    <button class="btn-ghost" onclick="workspaces.showCreate()">＋ Nuevo espacio</button>
    <button class="btn-ghost" onclick="workspaces.deleteCurrentWorkspace()" style="color:var(--danger)">Eliminar espacio actual</button>
    <button class="btn-ghost" onclick="app.logout()">Cerrar sesión</button>
  </div>
</nav>

<!-- ── MODAL: Nueva/editar tarjeta ──────────────────────────────── -->
<div id="modal-card" class="modal-overlay" onclick="if(event.target===this)cards.hideForm()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-card-title">Nueva tarjeta</h2>
      <button class="modal-close" onclick="cards.hideForm()">×</button>
    </div>
    <form id="card-form" class="modal-form" onsubmit="cards.submitForm(event)">
      <input type="hidden" id="card-id">

      <div class="field">
        <label>Título *</label>
        <input id="card-form-title" type="text" placeholder="ej: Pasta Carbonara" required>
      </div>

      <div class="field">
        <label>Categoría</label>
        <select id="card-form-category">
          <option value="">Sin categoría</option>
        </select>
      </div>

      <div class="field">
        <label>Descripción</label>
        <textarea id="card-form-desc" placeholder="Descripción, pasos, notas..."></textarea>
      </div>

      <div class="field">
        <label>Ingredientes / Lista (uno por línea)</label>
        <textarea id="card-form-ings" placeholder="Pasta&#10;Huevos&#10;Queso parmesano&#10;Panceta"></textarea>
      </div>

      <div class="field">
        <label>Etiquetas (separadas por coma)</label>
        <input id="card-form-tags" type="text" placeholder="pasta, italiano, rápido">
      </div>

      <div class="field">
        <label>Foto</label>
        <div class="photo-options">
          <label class="photo-option-btn">
            <input type="file" accept="image/*" capture="environment" id="card-form-photo-camera" onchange="cards.previewPhoto(this)">
            <span>📷</span>
            <span>Tomar foto</span>
          </label>
          <label class="photo-option-btn">
            <input type="file" accept="image/*" id="card-form-photo-gallery" onchange="cards.previewPhoto(this)">
            <span>🖼️</span>
            <span>Galería</span>
          </label>
        </div>
        <div id="card-photo-preview"></div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="cards.hideForm()">Cancelar</button>
        <button id="card-submit-btn" type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- ── MODAL: Detalle tarjeta ────────────────────────────────────── -->
<div id="modal-detail" class="modal-overlay" onclick="if(event.target===this)cards.hideDetail()">
  <div class="modal">
    <div class="modal-header">
      <h2>Detalle</h2>
      <button class="modal-close" onclick="cards.hideDetail()">×</button>
    </div>
    <div id="detail-content"></div>
    <div class="detail-actions">
      <button id="detail-edit-btn" class="btn-ghost">✏️ Editar</button>
      <button id="detail-del-btn"  class="btn-danger">🗑 Eliminar</button>
    </div>
  </div>
</div>

<!-- ── MODAL: Nuevo espacio de trabajo ──────────────────────────── -->
<div id="modal-workspace" class="modal-overlay" onclick="if(event.target===this)workspaces.hideCreate()">
  <div class="modal">
    <div class="modal-header">
      <h2>Nuevo espacio de trabajo</h2>
      <button class="modal-close" onclick="workspaces.hideCreate()">×</button>
    </div>
    <form class="modal-form" onsubmit="workspaces.submitCreate(event)">
      <div class="field">
        <label>Nombre *</label>
        <input id="ws-form-name" type="text" placeholder="ej: Trabajo mesero, Farmacia" required>
      </div>
      <div class="field">
        <label>Descripción</label>
        <input id="ws-form-desc" type="text" placeholder="Opcional">
      </div>
      <div class="field">
        <label>Ícono (emoji)</label>
        <input id="ws-form-icon" type="text" placeholder="📁" maxlength="4" value="📁">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="workspaces.hideCreate()">Cancelar</button>
        <button type="submit" class="btn-primary">Crear</button>
      </div>
    </form>
  </div>
</div>

<!-- ── MODAL: Prompt genérico ────────────────────────────────────── -->
<div id="modal-prompt" class="modal-overlay">
  <div class="modal" style="max-width:340px;margin:auto;border-radius:var(--radius)">
    <div class="modal-header">
      <h2 id="prompt-title">Ingresar valor</h2>
    </div>
    <div class="field" style="margin-bottom:16px">
      <input id="prompt-input" type="text">
    </div>
    <div class="modal-actions">
      <button id="prompt-cancel" class="btn-ghost">Cancelar</button>
      <button id="prompt-ok"     class="btn-primary">OK</button>
    </div>
  </div>
</div>

<!-- ── MODAL: Confirm ────────────────────────────────────────────── -->
<div id="modal-confirm" class="modal-overlay">
  <div class="modal" style="max-width:340px;margin:auto;border-radius:var(--radius)">
    <p id="confirm-msg" style="margin-bottom:20px;font-size:15px;line-height:1.5"></p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn-ghost">Cancelar</button>
      <button id="confirm-ok"     class="btn-danger">Eliminar</button>
    </div>
  </div>
</div>

<!-- ── Toasts ─────────────────────────────────────────────────────── -->
<div id="toasts"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/workspaces.js"></script>
<script src="js/cards.js"></script>
</body>
</html>
